# Static demo on GitHub Pages: the web app plus pre-rendered replays and scoreboard (no server, no keys).
name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build web app (static mode)
        working-directory: web
        env:
          VITE_STATIC: "1"
        run: |
          npm ci
          npx tsc -b
          npx vite build --base "/${{ github.event.repository.name }}/"
      - name: Pre-render API
        run: python scripts/build_static.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
