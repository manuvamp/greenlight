[project]
name = "greenlight"
version = "0.1.0"
description = "An agent that does the breaking dependency upgrades Dependabot can't: reads the migration guide, edits code, runs tests in a sandbox until green."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "openai>=1.60",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "tavily-python>=0.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
greenlight = "greenlight.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
