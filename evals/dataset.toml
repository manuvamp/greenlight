# Greenlight eval set: real public repos stuck on an old major version, pinned to a commit.
# Candidates were found and inspected in research/eval-candidates.md; every case is prechecked
# (baseline green, bump red) before it counts. Fields:
#   repo, sha, lib, to          what to upgrade
#   python                      force a Python version (old pins often need <=3.11)
#   test_args                   appended to pytest (paths, -o addopts="", --deselect …)
#   test_env                    env vars for the test run
#   baseline_pins               hold the starting state when the repo has no upper bound
#   extra_deps                  extra test-time deps (e.g. an older pytest)

